<!DOCTYPE html>
<html>
    <head>
        <title>...A WILD WEBPAGE ENCOUNTER!</title>
    </head>
    <body class="battle" style="background-color: bisque; font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif">
        <h1 id="punchinello">BATTLE AGAINST MONSTERS</h1>
        <section class="enigma">
            <img src="./assets/Enigma.png" style="width: 15%"></img>
            <h3>20/20 HP</h3>
        </section>
        <div style="background-color:orange;"><p>&nbsp;</p></div>
        <section class="buzzer">
            <img src="./assets/Buzzer.png" style="width: 15%"></img>
            <ol>
                <li><button>ATTACK</button></li>
                <li><label id="special" for="special-select">ITEM</label>></li>

                    <select id="special-select">
                        <option value="mushroom">Max Mushroom</option>
                        <option value="syrup">Honey Syrup</option>
                        <option value="essence">Red Essence</option>
                        <option value="candy">Rock Candy</option>
                    </select>
                <li><label id="item" for="item-select">SPECIAL</label>></li>

                    <select id="item-select">
                        <option value="thorn">Thorn Shot</option>
                        <option value="bubble">Bubble Shot</option>
                        <option value="fungi">Funguspike</option>
                    </select>

                <li><label id="etc" for="etc-select">ETC.</label>></li>

                    <select id="etc-select">
                        <option value="defend">Defense</option>
                        <option value="run">Run Away</option>
                    </select>
            </ol>
        </section>
    </body>
</html>
